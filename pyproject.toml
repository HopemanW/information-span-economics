[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "information-span-economics"
version = "0.1.0"
description = "Economics and causal-ML laboratory for information span, precision, and credit competition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
causal = ["econml>=0.16"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
